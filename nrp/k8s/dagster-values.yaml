# Helm values for the official `dagster/dagster` chart, NRP deployment.
#
#   helm repo add dagster https://dagster-io.github.io/helm
#   helm repo update
#   # PRE-FLIGHT (validate against the installed chart version — this
#   # file could not be `helm template`-checked offline when written):
#   helm template dagster dagster/dagster -n ucsd-center4health \
#     -f nrp/k8s/dagster-values.yaml | kubectl apply --dry-run=client -f -
#   helm upgrade --install dagster dagster/dagster -n ucsd-center4health \
#     -f nrp/k8s/dagster-values.yaml
#
# Fill every TODO before installing. Keys follow the standard dagster
# chart; pin the chart version (`--version`) and re-check the value
# paths against `helm show values dagster/dagster` for that version.

global:
  # The Bitnami subchart auto-creates secret `dagster-postgresql`;
  # point Dagster at the same one so passwords stay in sync.
  postgresqlSecretName: dagster-postgresql  # pragma: allowlist secret  (secret *name*, not a value)

imagePullSecrets:
  - name: gitlab-registry-cred

# Reuse our pre-created least-privilege SA (nrp/k8s/rbac.yaml) for the
# webserver/daemon AND launched run/step pods, so the daemon (which
# hosts the run launcher) has the job-create RBAC.
serviceAccount:
  create: false
  name: dagster-nrp

# REQUIRED for the Sobol fan-out: the daemon runs the backfill that
# launches the 100 per-partition runs. Without it, multi-run
# partitioned materialization does not execute.
dagsterDaemon:
  enabled: true
  # Run queue: one shared cap across BOTH code locations (nrp + nrp-hysplit)
  # so a HYSPLIT run and a sobol backfill can't jointly blow the NRP
  # 4-concurrent-pod policy. The HYSPLIT job is additionally capped at 1
  # concurrent run so it can never crowd out an in-flight sobol backfill.
  runCoordinator:
    enabled: true
    type: QueuedRunCoordinator
    config:
      queuedRunCoordinator:
        maxConcurrentRuns: 4
        tagConcurrencyLimits:
          - key: "dagster/job_name"
            value: "saturn_nestor_job"
            limit: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

dagsterWebserver:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
    port: 80
  # Reach it with: kubectl port-forward svc/dagster-dagster-webserver 3000:80
  # -n ucsd-center4health  (add an Ingress here only if NRP exposes one)

# Per-run/step K8s Jobs (one pod per Sobol chunk).
runLauncher:
  type: K8sRunLauncher
  config:
    k8sRunLauncher:
      imagePullPolicy: IfNotPresent
      jobNamespace: ucsd-center4health
      # All step pods get the full env (S3 creds+endpoint+bucket, Slack,
      # NRP_NAMESPACE) from this one secret — matches the keys in
      # nrp/k8s/job_template.yaml (object-store-credentials).
      envSecrets:
        - name: object-store-credentials

# Built-in Postgres (managed by the Dagster Helm chart).
# This DB holds all run history, event logs, and schedule/sensor state.
# It MUST be on a persistent volume or every pod restart wipes the run list.
generatePostgresqlPasswordSecret: false
postgresql:
  enabled: true
  postgresqlUsername: dagster
  postgresqlDatabase: dagster
  # Persist the data dir (/bitnami/postgresql) on a network-backed volume.
  # Pinned explicitly so it can never silently regress to an emptyDir if a
  # chart-default changes — losing run history is the failure this prevents.
  #
  # storageClass is intentionally LEFT UNSET so it resolves to the NRP
  # cluster default `rook-ceph-block` (Ceph RBD — network storage that
  # survives the postgres pod rescheduling across NRP nodes; a node-local
  # class such as `local-storage` would strand the data on one node).
  # Do NOT add `storageClass:` here on an existing release: a StatefulSet's
  # volumeClaimTemplates are immutable, so changing it makes `helm upgrade`
  # fail. To switch classes you must `kubectl delete statefulset
  # dagster-postgresql --cascade=orphan` first (keeps the pod + PVC), then
  # upgrade. The current bound PVC `data-dagster-postgresql-0` is already on
  # rook-ceph-block, so the values below render an identical template.
  persistence:
    enabled: true
    size: 8Gi
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    port: 5432

# Code locations. Two deployments against the one Dagster instance:
#   nrp         — sobol/MCMC/CV/reporting (module nrp.definitions),
#                 plain worker image.
#   nrp-hysplit — Saturn→Nestor HYSPLIT (module nrp.saturn_definitions),
#                 worker-hysplit image (license-gated binary baked in).
# Separate locations = separate images + gRPC servers, so pushing/pinning
# the -hysplit image never redeploys or interrupts the sobol location.
dagster-user-deployments:
  enabled: true
  imagePullSecrets:
    - name: gitlab-registry-cred
  deployments:
    - name: nrp
      # digest-pinned worker image (must match nrp/.env
      # DAGSTER_IMAGE; build/push per nrp/DEPLOYMENT.md §1).
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      image:
        repository: gitlab-registry.nrp-nautilus.io/ucsd-center4health/nrp-worker
        tag: "dev"
        pullPolicy: Always
      dagsterApiGrpcArgs:
        - "-m"
        - "nrp.definitions"
      port: 3030
      includeConfigInLaunchedRuns:
        enabled: true
      envSecrets:
        - name: object-store-credentials
    - name: nrp-hysplit
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      image:
        # -hysplit variant (make docker-build-hysplit); pin a digest here
        # when running the workload for real (DEPLOYMENT.md §8a).
        repository: gitlab-registry.nrp-nautilus.io/ucsd-center4health/nrp-worker
        tag: "dev-hysplit"
        pullPolicy: Always
      dagsterApiGrpcArgs:
        - "-m"
        - "nrp.saturn_definitions"
      port: 3030
      includeConfigInLaunchedRuns:
        enabled: true
      envSecrets:
        - name: object-store-credentials
